name: Update Freelo API spec

on:
  schedule:
    # Weekly on Monday 06:00 UTC — catches new spec revisions without
    # spamming PRs every day. Workflow is a no-op if upstream hasn't changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh spec and regenerate client
        run: make gen

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet spec/ internal/api/freelo/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test with new spec
        if: steps.diff.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./...

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(api): refresh Freelo OpenAPI spec"
          branch: chore/refresh-api-spec
          delete-branch: true
          title: "chore(api): refresh Freelo OpenAPI spec"
          body: |
            Automated weekly refresh of `spec/freelo-api.yaml` and the generated
            `internal/api/freelo/freelo.gen.go` client.

            Review the diff in `spec/` for upstream changes to the Freelo API,
            then verify the `internal/api/freelo/` regeneration compiles and
            existing command code still matches the client surface.

            If compilation breaks on our end, it means Freelo changed a schema
            name, parameter type, or endpoint path that our commands depend on.
          labels: |
            dependencies
            automated
