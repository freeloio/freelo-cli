name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$diff"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

  release-dryrun:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    # Snapshot build proves all 6 release artifacts compile cleanly on every
    # PR. No publishing — `--snapshot` skips the GitHub release step.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser reads the full commit history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (snapshot, no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Smoke-test the linux/amd64 binary
        run: |
          set -e
          tar -tzf dist/freelo_*_linux_amd64.tar.gz
          tar -xzf dist/freelo_*_linux_amd64.tar.gz -C /tmp/ freelo
          /tmp/freelo version

  gosec:
    name: gosec security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # `-no-fail` keeps the job green even if gosec finds issues — the
          # findings still print into the job log and we review them on
          # every PR. Without -no-fail, any finding would block CI; we'd
          # rather have a visible report than a forced red.
          # `-fmt=text` writes to the log; on a private repo without GHAS,
          # SARIF + code-scanning upload is unavailable, so a text report
          # is the most useful output we can produce. When the repo flips
          # public (GHAS free), switch back to SARIF + upload-sarif.
          # (No -exclude-dir needed since v1.1.0 — the generated client
          # moved to github.com/freeloio/freelo-go.)
          args: '-no-fail -fmt=text ./...'
