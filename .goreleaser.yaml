project_name: freelo

before:
  hooks:
    - go mod tidy

builds:
  - id: freelo
    main: ./cmd/freelo
    binary: freelo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/freeloio/freelo-cli/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: freeloio
    name: freelo-cli
  draft: true  # Start as draft for internal review
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: freelo
    repository:
      owner: freeloio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://www.freelo.io"
    description: "Official CLI for Freelo project management"
    license: "MIT"
    install: |
      bin.install "freelo"
    test: |
      system "#{bin}/freelo", "version"
    # Skip brew publish during internal testing
    skip_upload: auto
