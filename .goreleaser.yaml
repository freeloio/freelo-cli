project_name: freelo

before:
  hooks:
    - go mod tidy

builds:
  - id: freelo
    main: ./cmd/freelo
    binary: freelo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/freeloio/freelo-cli/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: freeloio
    name: freelo-cli
  draft: true  # Start as draft for internal review
  prerelease: auto
  name_template: "v{{.Version}}"

# Homebrew distribution intentionally NOT configured for v1.0.0.
# Reasons:
# - The `freeloio/homebrew-tap` repository does not yet exist.
# - GoReleaser v2 deprecates `brews:` in favor of `homebrew_casks:`,
#   which uses a different schema (binary: stanza, not Ruby `install:`).
# Plan: ship v1.0.0 with curl/install.sh + go install + GitHub Releases as
# the install paths, then add `homebrew_casks:` in a v1.0.x follow-up once
# the tap repo + HOMEBREW_TAP_TOKEN secret are provisioned.
